name: Update prices

on:
  schedule:
    # Runs once a day at 06:00 UTC (~12:00 PM Bangladesh time). Free on GitHub.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scrape_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "receiptgg-price-bot"
          git config user.email "actions@github.com"
          git add data/prices.json
          git diff --quiet --cached || git commit -m "Update prices ($(date -u +'%Y-%m-%d'))"
          git push
